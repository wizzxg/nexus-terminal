<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Top Tier Terminal</title>
    <style>
        :root { --bg: #050508; --panel: rgba(15, 15, 22, 0.85); --neon-blue: #00f3ff; --neon-red: #ff003c; --neon-purple: #b500ff; --text: #e0e0e0; --glow: 0 0 15px rgba(0, 243, 255, 0.3); }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-y: scroll; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }
        h1 { color: var(--neon-blue); text-shadow: var(--glow); margin: 2rem 0 1rem; letter-spacing: 3px; font-weight: 800; text-transform: uppercase; }
        
        #login-section { background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 16px; padding: 40px; text-align: center; margin-top: 10vh; box-shadow: var(--glow); width: 90%; max-width: 400px; }
        #cookie-input { width: 100%; box-sizing: border-box; padding: 12px 15px; margin: 20px 0; background: rgba(0,0,0,0.6); border: 1px solid #444; color: var(--neon-blue); border-radius: 8px; outline: none; font-family: monospace; }
        #cookie-input:focus { border-color: var(--neon-blue); }
        
        #dashboard-section { width: 100%; max-width: 1400px; padding: 0 20px; box-sizing: border-box; }
        .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(10px); padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; }
        .controls-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; background: var(--panel); padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .search-bar { flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 6px; border: 1px solid #444; background: rgba(0,0,0,0.5); color: #fff; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--neon-blue); }
        .stats-display { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        #requests-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; width: 100%; padding-bottom: 20px; }
        
        .user-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); transition: transform 0.2s, border-color 0.2s; position: relative; }
        .user-card:hover { border-color: rgba(0, 243, 255, 0.4); transform: translateY(-3px); }
        .pfp { width: 90px; height: 90px; border-radius: 50%; border: 3px solid rgba(0, 243, 255, 0.2); margin-bottom: 15px; padding: 3px; background: #000; }
        .names { width: 100%; margin-bottom: 20px; }
        .names h2 { margin: 0; font-size: 1.15rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .names p { margin: 5px 0 0 0; font-size: 0.9rem; color: var(--neon-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .actions { display: flex; width: 100%; gap: 12px; }
        button { padding: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; flex: 1; font-size: 0.85rem; letter-spacing: 1px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-blue { background: rgba(0, 243, 255, 0.05); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .btn-blue:hover:not(:disabled) { background: var(--neon-blue); color: #000; box-shadow: var(--glow); }
        .btn-red { background: rgba(255, 0, 60, 0.05); color: var(--neon-red); border: 1px solid var(--neon-red); }
        .btn-red:hover:not(:disabled) { background: var(--neon-red); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }
        .btn-purple { background: rgba(181, 0, 255, 0.05); color: var(--neon-purple); border: 1px solid var(--neon-purple); }
        .btn-purple:hover:not(:disabled) { background: var(--neon-purple); color: #fff; box-shadow: 0 0 15px rgba(181, 0, 255, 0.4); }
        .btn-white { background: transparent; color: #fff; border: 1px solid #555; }
        .btn-white:hover:not(:disabled) { background: #fff; color: #000; }

        .skeleton-pfp { width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.05); margin-bottom: 15px; animation: pulse 1.5s infinite; }
        .skeleton-text { width: 80%; height: 14px; background: rgba(255,255,255,0.05); margin: 6px 0; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 0.6; } 100% { opacity: 0.2; } }

        .toggle-container { display: flex; align-items: center; gap: 10px; color: #ccc; font-size: 0.9rem; cursor: pointer; user-select: none; }
        
        .pagination-bar { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 50px; background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.15); }
        .page-indicator { font-weight: bold; color: var(--neon-blue); letter-spacing: 1px; }

        #export-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--panel); border: 1px solid var(--neon-purple); border-radius: 12px; padding: 30px; width: 80%; max-width: 600px; box-shadow: 0 0 30px rgba(181, 0, 255, 0.2); }
        .modal-content h2 { margin-top: 0; color: var(--neon-purple); }
        #export-textarea { width: 100%; height: 300px; background: #000; color: var(--neon-blue); border: 1px solid #444; border-radius: 6px; padding: 15px; box-sizing: border-box; font-family: monospace; resize: vertical; margin-bottom: 20px; outline: none; }
        
        #toast-container { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; }
        .toast { background: rgba(15, 15, 22, 0.95); backdrop-filter: blur(5px); border-left: 4px solid var(--neon-blue); padding: 16px 24px; color: #fff; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .toast.error { border-left-color: var(--neon-red); }
        .toast.purple { border-left-color: var(--neon-purple); }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <h1>NEXUS // TERMINAL</h1>

    <div id="login-section">
        <h2 style="margin-top:0;">System Override</h2>
        <input type="password" id="cookie-input" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."><br>
        <button class="btn-blue" onclick="saveCookie()" style="padding: 12px 30px; width: 100%;">Initialize Connection</button>
    </div>

    <div id="dashboard-section" style="display: none;">
        <div class="sticky-header">
            <div class="controls-grid">
                <input type="text" id="search-input" class="search-bar" placeholder="Search targets..." oninput="handleFilterChange()">
                
                <label class="toggle-container">
                    <input type="checkbox" id="bot-filter-toggle" onchange="handleFilterChange()">
                    Strict Anti-Bot Filter
                </label>
                
                <div class="stats-display" id="request-count" style="color: var(--neon-blue);">Targets Found: 0</div>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn-blue" onclick="massActionAll('accept')" id="btn-accept-all" style="padding: 10px 15px;">ACCEPT ALL</button>
                    <button class="btn-red" onclick="massActionAll('decline')" id="btn-decline-all" style="padding: 10px 15px;">DECLINE ALL</button>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button class="btn-purple" onclick="exportBlocklist()" style="padding: 10px 15px;">Export Blocklist</button>
                    <button class="btn-blue" onclick="manualRefresh()" style="padding: 10px 15px;">⟳ Sync</button>
                    <button class="btn-white" onclick="logout()" style="padding: 10px 15px;">Disconnect</button>
                </div>
            </div>
        </div>
        
        <div id="requests-container"></div>

        <div class="pagination-bar">
            <button class="btn-white" onclick="changePage(-1)" id="btn-prev" style="max-width: 150px;">◄ Previous</button>
            <div class="page-indicator" id="page-indicator">Page 1 of 1</div>
            <button class="btn-white" onclick="changePage(1)" id="btn-next" style="max-width: 150px;">Next ►</button>
        </div>
    </div>

    <div id="export-modal">
        <div class="modal-content">
            <h2>System Blocklist Data</h2>
            <p style="color: #888; font-size: 0.9rem;">This data is auto-saved to your server, but you can copy it below for backup.</p>
            <textarea id="export-textarea" readonly></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-purple" onclick="copyExportText()">Copy to Clipboard</button>
                <button class="btn-white" onclick="closeModal()">Close Window</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const container = document.getElementById('requests-container');
        const searchInput = document.getElementById('search-input');
        const filterToggle = document.getElementById('bot-filter-toggle');
        const countDisplay = document.getElementById('request-count');
        const pageIndicator = document.getElementById('page-indicator');
        const exportModal = document.getElementById('export-modal');
        const exportTextarea = document.getElementById('export-textarea');
        
        let isProcessingMassAction = false;
        let currentIds = []; 
        let loadedDetailsMap = new Map();
        
        let currentPage = 1;
        const itemsPerPage = 60; 

        function showToast(message, type = '') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function checkAuth() {
            const cookie = localStorage.getItem('nexusSession');
            if (cookie) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                if (currentIds.length === 0) loadRequests();
            } else {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            }
        }

        function saveCookie() {
            const input = document.getElementById('cookie-input').value.trim();
            if (input) {
                localStorage.setItem('nexusSession', input);
                document.getElementById('cookie-input').value = '';
                
                currentIds = [];
                loadedDetailsMap.clear();
                currentPage = 1;
                container.innerHTML = '';
                
                checkAuth();
            }
        }

        function logout() {
            localStorage.removeItem('nexusSession');
            currentIds = []; loadedDetailsMap.clear();
            container.innerHTML = '';
            checkAuth();
        }

        function manualRefresh() {
            if (isProcessingMassAction) { showToast("Wait for current operation to finish.", "error"); return; }
            showToast("Initiating Fast Sync...");
            container.innerHTML = ''; 
            currentIds = [];
            loadedDetailsMap.clear();
            currentPage = 1;
            loadRequests();
        }

        async function exportBlocklist() {
            try {
                const response = await fetch('https://nexus-backend-e72a.onrender.com/api/blocklist');
                const data = await response.json();
                
                if (data.ids && data.ids.length > 0) {
                    const formattedText = data.ids.map(id => `"${id}",`).join('\n');
                    exportTextarea.value = formattedText;
                } else {
                    exportTextarea.value = "Your blocklist is currently empty.";
                }
                exportModal.style.display = 'flex';
            } catch (err) {
                showToast("Failed to retrieve blocklist data.", "error");
            }
        }

        function closeModal() { exportModal.style.display = 'none'; }
        function copyExportText() {
            exportTextarea.select(); document.execCommand('copy');
            showToast("Copied successfully to clipboard!", "purple");
        }

        async function loadRequests() {
            const cookie = localStorage.getItem('nexusSession');
            if (!cookie) return;

            try {
                const response = await fetch('https://nexus-backend-e72a.onrender.com/api/requests/ids', { headers: { 'roblox-cookie': cookie } });
                const ids = await response.json();
                
                if (ids.error) throw new Error(ids.error);

                currentIds = ids;
                countDisplay.innerText = `Total Targets: ${currentIds.length}`;
                renderPage(); 
            } catch (err) {
                showToast('API sync failed. Refresh the page.', 'error');
            }
        }

        function handleFilterChange() { renderPage(); }

        function changePage(direction) {
            const maxPage = Math.ceil(currentIds.length / itemsPerPage);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > maxPage) currentPage = maxPage;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderPage();
        }

        function renderPage() {
            container.innerHTML = '';
            const maxPage = Math.ceil(currentIds.length / itemsPerPage) || 1;
            pageIndicator.innerText = `Page ${currentPage} of ${maxPage}`;
            
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = currentPage === maxPage;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageIds = currentIds.slice(startIndex, endIndex);

            if (pageIds.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666; width: 100%; grid-column: 1 / -1;">No targets found.</p>';
                return;
            }

            pageIds.forEach(id => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.id = `user-${id}`;
                container.appendChild(card);
                updateCardVisual(id, card);
            });

            hydrateVisibleIds(pageIds);
        }

        async function hydrateVisibleIds(pageIds) {
            const unhydrated = pageIds.filter(id => !loadedDetailsMap.has(id));
            if (unhydrated.length === 0) return;

            try {
                const response = await fetch('https://nexus-backend-e72a.onrender.com/api/requests/details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userIds: unhydrated })
                });
                const details = await response.json();
                
                details.forEach(d => loadedDetailsMap.set(d.id, d));
                
                pageIds.forEach(id => {
                    const card = document.getElementById(`user-${id}`);
                    if (card) updateCardVisual(id, card);
                });
            } catch (e) {
                console.error("Hydration failed");
            }
        }

        function updateCardVisual(id, card) {
            const details = loadedDetailsMap.get(id);
            
            if (!details) {
                card.classList.add('skeleton-card');
                card.innerHTML = `
                    <div class="skeleton-pfp"></div>
                    <div class="names" style="display:flex; flex-direction:column; align-items:center;">
                        <div class="skeleton-text"></div><div class="skeleton-text" style="width: 50%;"></div>
                    </div>
                    <div class="actions" style="opacity:0.3; pointer-events:none;">
                        <button class="btn-blue">ACCEPT</button><button class="btn-red">DECLINE</button>
                    </div>
                `;
                return;
            }

            let shouldShow = true;
            if (filterToggle.checked && details.username.toLowerCase() === details.displayName.toLowerCase()) shouldShow = false;
            if (searchInput.value.trim()) {
                const query = searchInput.value.toLowerCase().trim();
                if (!details.username.toLowerCase().includes(query) && !details.displayName.toLowerCase().includes(query)) shouldShow = false;
            }

            if (!shouldShow) {
                card.style.display = 'none';
                return;
            }

            card.style.display = 'flex';
            card.classList.remove('skeleton-card');
            card.classList.add('hydrated-card');
            card.innerHTML = `
                <img src="${details.pfp}" alt="Avatar" class="pfp">
                <div class="names"><h2>${details.displayName}</h2><p>@${details.username}</p></div>
                <div class="actions">
                    <button class="btn-blue" onclick="handleAction(${id}, 'accept', this)">ACCEPT</button>
                    <button class="btn-red" onclick="handleAction(${id}, 'decline', this)">DECLINE</button>
                </div>
            `;
        }

        async function handleAction(userId, action, btnElement) {
            const cookie = localStorage.getItem('nexusSession');
            const card = document.getElementById(`user-${userId}`);
            
            if (card) { card.style.opacity = '0.4'; card.style.filter = 'grayscale(100%)'; }

            try {
                const response = await fetch('https://nexus-backend-e72a.onrender.com/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'roblox-cookie': cookie },
                    body: JSON.stringify({ userId, action })
                });

                const result = await response.json();
                if (result.success || result.reason === "Ghost Request") {
                    if (card) {
                        card.style.transform = 'scale(0.8)';
                        card.style.opacity = '0';
                        setTimeout(() => card.remove(), 200);
                    }
                    currentIds = currentIds.filter(id => id !== userId);
                    loadedDetailsMap.delete(userId);
                    countDisplay.innerText = `Total Targets: ${currentIds.length}`;
                    return true;
                }
            } catch (err) {
                if (card) { card.style.opacity = '1'; card.style.filter = 'none'; }
                return false;
            }
        }

        // --- NEW GLOBAL MASS ACTION ---
        async function massActionAll(action) {
            if (currentIds.length === 0) { showToast("No targets found to process.", "error"); return; }
            
            if (!confirm(`GLOBAL EXECUTION WARNING: This will automatically ${action.toUpperCase()} ALL ${currentIds.length} valid targets across all pages.\n\nProceed?`)) return;

            isProcessingMassAction = true;
            document.getElementById('btn-accept-all').disabled = true;
            document.getElementById('btn-decline-all').disabled = true;

            showToast(`Executing mass ${action} on all targets. Do not close tab...`, 'neon-blue');

            let successCount = 0;
            const idsToProcess = [...currentIds]; // Copy the array so it doesn't break while filtering

            for (let i = 0; i < idsToProcess.length; i++) {
                const id = idsToProcess[i];
                countDisplay.innerText = `Processing: ${i + 1} / ${idsToProcess.length}`;
                
                const success = await handleAction(id, action, null);
                if (success) successCount++;
                
                // Safe delay to prevent Roblox API blocks
                await delay(350); 
            }

            showToast(`Execution complete. Processed ${successCount} targets.`);
            isProcessingMassAction = false;
            document.getElementById('btn-accept-all').disabled = false;
            document.getElementById('btn-decline-all').disabled = false;
            
            renderPage(); // Visually refresh the grid once finished
        }

        checkAuth();
    </script>
</body>
</html>
